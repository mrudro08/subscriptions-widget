# Builds the Windows installer (Subscriptions_1.0.0_x64-setup.exe).
# Push this folder to a GitHub repo, then: Actions → "Build Windows installer" → Run workflow.
# The installer appears under the run's "Artifacts".
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (renewal maths)
        run: npm test

      - name: Build installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Subscriptions-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
