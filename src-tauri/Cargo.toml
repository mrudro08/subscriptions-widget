[package]
name = "subscriptions"
version = "1.0.0"
description = "Subscriptions — a small offline desktop widget for renewal reminders"
authors = ["Spectra"]
edition = "2021"

[lib]
name = "subscriptions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No HTTP client, no updater, no telemetry: the app never talks to the network.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
